# dcc.py 설정 예시. combos.ini 로 복사해 경로를 바꿔 쓴다 (combos.ini 는 git 에 올리지 않음).
# 상대 경로는 이 파일이 있는 폴더 기준. 조합 키가 [defaults] 보다 우선.
# 키: por(한 줄에 하나, 2회 이상), doe, level, blank(한 줄에 하나), blank_map, key, encoding, r, groups, scales,
#     abs_tol, before, out
# scales = group,scale 파일 (log, linear, auto). 주면 판정에 --groups 와 같이 넘겨 그룹마다 log 옵션 대상을 정한다
# abs_tol = group,abs_delta 파일 (ITEM 단위). 주면 판정에 --groups 와 같이 넘긴다. 절대 허용폭 참고 판정(verdict_abs)에만 쓴다

[defaults]
out = 결과
level = item_info.csv
groups = groups.csv
scales = scales.csv

[A1]
por = data/A/POR1
      data/A/POR2
      data/A/POR3
doe = data/A/DOE

[B2]
por = data/B/POR1
      data/B/POR2
doe = data/B/DOE
level = item_info_B.csv
